<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Post · Diana connection check</title><link rel="stylesheet" href="src/styles.css"></head><body><main><section class="card"><img src="assets/logo.svg" width="96" height="96" alt="Future Post postbox"><div><h1>Meet your Diana account</h1><p>This check requests a public account connection. It does not sign, send, deploy or open a window.</p><button id="connect" class="primary">Connect QoreX on Diana</button><pre id="result" aria-live="polite">Choose TESTNET inside QoreX first.</pre><a href="index.html">Back to the letter</a></div></section></main><script type="module">
import {connectDiana} from './src/qorex-session.js';
document.querySelector('#connect').onclick=async()=>{const out=document.querySelector('#result');try{out.textContent=JSON.stringify(await connectDiana(window.qorex),null,2);}catch(e){out.textContent=e.message;}};
</script></body></html>
